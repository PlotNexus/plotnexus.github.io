name: Scrape listings

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: scrape-listings
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Guards against a worst-case day (CASA SAPO blocking almost every
    # request) running long enough to bump into the next 6h schedule.
    # Comfortably above the slowest real run seen so far (~95min).
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install scraper dependencies
        working-directory: scripts/scrape
        run: npm ci

      - name: Run scrapers
        working-directory: scripts/scrape
        run: node index.js

      - name: Commit updated listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/listings.json data/listings-detail.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update scraped listings [skip ci]"
            git push
          fi
