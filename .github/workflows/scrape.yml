name: Scrape listings

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: scrape-listings
  cancel-in-progress: false

jobs:
  # Splits the national sweep across parallel jobs — each covers a subset
  # of districts and a slice of detail enrichment, so no single job (and
  # likely no single runner IP) ever makes the full ~150-request run by
  # itself. `fail-fast: false` means one shard timing out or erroring
  # doesn't cancel the others; finalize below still uses whatever landed.
  scrape-shard:
    runs-on: ubuntu-latest
    # Real worst case per shard is a fraction of the old single-job run
    # (~115min for the full sweep) — generous margin still included.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install scraper dependencies
        working-directory: scripts/scrape
        run: npm ci

      - name: Scrape shard
        working-directory: scripts/scrape
        run: node worker.js
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: 4
          MAX_DETAIL_PER_SHARD: 20

      - name: Upload shard result
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: scripts/scrape/shard-output/shard-${{ matrix.shard }}.json
          retention-days: 1
          if-no-files-found: warn

  # Combines every shard's output and does the one commit+push for the
  # whole run. `if: always()` so this still runs (with whichever shards
  # succeeded) even if one or more shards failed or timed out.
  finalize:
    needs: scrape-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install scraper dependencies
        working-directory: scripts/scrape
        run: npm ci

      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: scripts/scrape/shard-artifacts
          merge-multiple: true

      - name: Merge shards into listings
        working-directory: scripts/scrape
        run: node finalize.js

      - name: Commit updated listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/listings.json data/listings-detail.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update scraped listings [skip ci]"
            git push
          fi
