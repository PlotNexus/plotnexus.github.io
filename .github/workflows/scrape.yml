name: Scrape listings

on:
  workflow_dispatch:
    inputs:
      max_detail_per_shard_source:
        description: "Detail fetches per shard per source (bump for a one-off catch-up burst; leave default for routine runs)"
        required: false
        default: "20"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: scrape-listings
  cancel-in-progress: false

jobs:
  # Splits the national sweep across parallel jobs — each covers a subset
  # of every registered source's districts/locations and a slice of detail
  # enrichment, so no single job (and likely no single runner IP) ever
  # makes a source's full national sweep by itself. `fail-fast: false`
  # means one shard timing out or erroring doesn't cancel the others;
  # finalize below still uses whatever landed.
  scrape-shard:
    runs-on: ubuntu-latest
    # Generous margin: two sources now share each shard (~2.5x the search
    # queries and 2x the detail fetches of the CASA SAPO-only shards,
    # which took ~15-25min each in practice) — and headroom for an
    # occasional manual catch-up burst with a larger detail batch.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install scraper dependencies
        working-directory: scripts/scrape
        run: npm ci

      - name: Scrape shard
        working-directory: scripts/scrape
        run: node worker.js
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: 4
          MAX_DETAIL_PER_SHARD_SOURCE: ${{ github.event.inputs.max_detail_per_shard_source || '20' }}
          # Kept comfortably under the job's own timeout-minutes (180) so
          # the script always has time to stop itself cleanly and let the
          # upload step run, rather than the whole job being killed with
          # its local progress never leaving the runner.
          MAX_RUNTIME_MINUTES: 165
          # Only shard 0 ever uses this (see idealista.js's DISTRICTS_FULL
          # comment) — harmless for the other three shards to have it too.
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}

      - name: Upload shard result
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: scripts/scrape/shard-output/shard-${{ matrix.shard }}.json
          retention-days: 1
          if-no-files-found: warn

  # Combines every shard's output and does the one commit+push for the
  # whole run. `if: always()` so this still runs (with whichever shards
  # succeeded) even if one or more shards failed or timed out.
  finalize:
    needs: scrape-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install scraper dependencies
        working-directory: scripts/scrape
        run: npm ci

      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: scripts/scrape/shard-artifacts
          merge-multiple: true

      - name: Merge shards into listings
        working-directory: scripts/scrape
        run: node finalize.js

      - name: Commit updated listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # A run that gets queued behind another one (concurrency group)
          # checks out main at enqueue time, not at start time — if the
          # earlier run pushes before this one reaches this step, the
          # push below is rejected as non-fast-forward. Rather than just
          # failing, re-sync to the new main and redo the merge with our
          # own logic (never a raw git merge/rebase of the data files,
          # which finalize.js already produces deterministically from the
          # shard artifacts) before retrying.
          for attempt in 1 2 3; do
            git add data/listings.json data/listings-detail.json
            if git diff --cached --quiet; then
              echo "No changes to commit"
              break
            fi
            git commit -m "chore: update scraped listings [skip ci]"
            if git push; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::Push failed after $attempt attempts"
              exit 1
            fi
            echo "Push rejected (attempt $attempt) — re-syncing to latest main and re-merging"
            git reset --soft HEAD~1
            git fetch origin main
            git reset --hard origin/main
            (cd scripts/scrape && node finalize.js)
          done
