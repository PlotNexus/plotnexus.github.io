name: RapidAPI probe (one-off)

# Throwaway diagnostic, not part of the production scraper. RapidAPI's
# marketplace search is a JS-heavy SPA that doesn't return real results
# in a plain HTTP fetch, so this renders it with a real browser to see
# whether a usable Idealista/real-estate/web-scraping API is actually
# listed there with a free tier — a plain, non-adversarial target, so
# this can just run directly rather than needing careful pacing.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install probe dependencies
        working-directory: scripts/scrape/experiments/rapidapi-probe
        run: npm install

      - name: Install Playwright Chromium
        working-directory: scripts/scrape/experiments/rapidapi-probe
        run: npx playwright install --with-deps chromium

      - name: Run probe
        working-directory: scripts/scrape/experiments/rapidapi-probe
        run: node probe.js

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapidapi-probe-output
          path: scripts/scrape/experiments/rapidapi-probe/out/
          retention-days: 7
          if-no-files-found: warn
