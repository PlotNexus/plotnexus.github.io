name: OLX probe (one-off)

# Throwaway diagnostic, not part of the production scraper. Checks from a
# real GitHub Actions runner IP whether OLX Portugal's imóveis category is
# reachable with a plain HTTP fetch (no browser needed — unlike the
# RapidAPI probe, OLX's listing pages appeared server-rendered when
# checked externally), what its real URL/category structure looks like,
# and whether a modest burst of requests trips any rate-limit/block
# response — before deciding whether it's worth building as a real source.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install probe dependencies
        working-directory: scripts/scrape/experiments/olx-probe
        run: npm install

      - name: Run probe
        working-directory: scripts/scrape/experiments/olx-probe
        run: node probe.js

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: olx-probe-output
          path: scripts/scrape/experiments/olx-probe/out/
          retention-days: 7
          if-no-files-found: warn
